# Release config for the TeTeHacko fork (registry address tetehacko/grafana).
# Same provider build and signing as .goreleaser.yml, limited to the platforms
# we run Terraform on and without the generate tool, so it builds locally.
version: 2
builds:
  - id: terraform-provider-grafana
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - id: terraform-provider-grafana
    formats: [zip]
    name_template: 'terraform-provider-grafana_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    ids:
      - terraform-provider-grafana
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-file"
      - "{{ .Env.GPG_PASSPHRASE_FILE }}"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  github:
    owner: TeTeHacko
    name: terraform-provider-grafana
  draft: true
  mode: replace
